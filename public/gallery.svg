<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none">
  <title>A gallery of four abstract paintings in wooden frames</title>
  <defs>
    <linearGradient id="wall" x1="240" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8e1d5"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path fill="url(#wall)" d="M0 0h480v240H0z"/>
  <path fill="url(#light)" d="m146 20-69 174h145L158 20zm176 0-69 174h145L334 20z"/>
